name: Playwright Grind

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include:
          - account: 1
            collab: UCz9li2hCp-aE1notlZcb94Q
          - account: 2
            collab: UCZvFABFgKLEVYN2n4-GZJng
          - account: 3
            collab: UCQookpoLNSGkO8YOMSBUNVQ
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install playwright
          for i in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: Run grinder (account ${{ matrix.account }})
        run: node runner.js
        env:
          LOCAL_STORAGE_JSON: ${{ secrets[format('LOCAL_STORAGE_JSON_{0}', matrix.account)] }}
          COLLAB_CHANNEL_ID: ${{ matrix.collab }}
