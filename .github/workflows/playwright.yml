name: Playwright Grind

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install playwright
          for i in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: Run grinder
        run: node runner.js
        env:
          LOCAL_STORAGE_JSON: ${{ secrets.LOCAL_STORAGE_JSON_3 }}
          COLLAB_CHANNEL_ID: UCTqJpW96pPJ4rhyqXBAvs0w
