name: Playwright Grind

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        account: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: npm install playwright && npx playwright install --with-deps chromium

      - name: Run grinder (account ${{ matrix.account }})
        run: node runner.js
        env:
          LOCAL_STORAGE_JSON: ${{ secrets[format('LOCAL_STORAGE_JSON_{0}', matrix.account)] }}
